name: Quest G1 Prototype

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/quest_g1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototypes/quest_g1/requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Fetch pinned simulation assets
        run: |
          git init vendor/TWIST2
          git -C vendor/TWIST2 remote add origin https://github.com/amazon-far/TWIST2.git
          git -C vendor/TWIST2 fetch --depth 1 origin b06178f19a22f2138cbd31f60c6d494bc263f67d
          git -C vendor/TWIST2 checkout --detach FETCH_HEAD
      - run: python -m unittest discover -s tests -v
      - name: Check reference-space event timing
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iandroid/native tests/check_tracking_space.cpp -o /tmp/check-tracking-space
          /tmp/check-tracking-space
      - name: Install GMR numerical oracle dependencies
        run: python -m pip install -r android/requirements-gmr-test.txt
      - name: Fetch pinned GMR source
        run: |
          git init vendor/GMR
          git -C vendor/GMR remote add origin https://github.com/YanjieZe/GMR.git
          git -C vendor/GMR fetch --depth 1 origin bb1bbe40774794fceb2a7c579a3464a28e68c844
          git -C vendor/GMR checkout --detach FETCH_HEAD
      - name: Compare native retargeter with upstream GMR
        run: |
          python scripts/export_gmr.py
          python scripts/build_gmr_oracle.py
          python scripts/check_gmr_parity.py
