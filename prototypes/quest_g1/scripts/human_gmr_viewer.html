<div id="human-gmr-view">
<h3>Камера → GMR · человеческий скелет</h3>
<div class="viz-row text-small"><span>Рост 175 см · постоянные длины костей</span><span>Сетка 50 см</span></div>
<canvas aria-label="Трёхмерная анимация скелета с руками и головой. Перетаскивание вращает камеру, колесо меняет масштаб." role="img"></canvas>
<div class="viz-controls"><label class="form-label">Точки камеры <select class="form-select" data-source><option value="rtmw">RTMW · проверка геометрии</option><option value="yolo">YOLO · исходный вариант</option></select></label><button type="button" class="btn btn-primary" data-play>Играть</button><label class="form-check"><input class="form-check-input" type="checkbox" data-raw><span class="form-check-label">Исходные точки камеры</span></label><label class="form-label">Скорость <select class="form-select" data-speed><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div>
<label class="form-label">Время <span class="tabular-nums" data-time></span><input class="form-range" type="range" min="0" step="0.01" value="0" data-timeline></label>
<div class="viz-row text-small"><span>Перетаскивание — поворот · колесо — масштаб</span><span data-status aria-live="polite">Пауза</span><span data-inferred></span><span data-support></span></div>
<div class="viz-row text-small"><span><i class="upper"></i>Корпус, руки, голова</span><span><i class="lower"></i>Ноги</span><span><i class="raw"></i>Камера: пунктир</span></div>
<script type="application/json" id="human-gmr-data">__ANIMATION_DATA__</script>
</div>
<style>
#human-gmr-view canvas{display:block;width:100%;height:440px;touch-action:none;cursor:grab}
#human-gmr-view .viz-row{gap:16px}
#human-gmr-view i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}
#human-gmr-view .upper{background:var(--viz-series-1)}
#human-gmr-view .lower{background:var(--viz-series-2)}
#human-gmr-view .raw{background:var(--muted-foreground)}
@media(max-width:450px){#human-gmr-view canvas{height:360px}}
</style>
<script>
(()=>{
const root=document.getElementById('human-gmr-view'),datasets=JSON.parse(document.getElementById('human-gmr-data').textContent),cv=root.querySelector('canvas'),ctx=cv.getContext('2d'),slider=root.querySelector('[data-timeline]'),play=root.querySelector('[data-play]'),raw=root.querySelector('[data-raw]'),speed=root.querySelector('[data-speed]'),time=root.querySelector('[data-time]'),status=root.querySelector('[data-status]');
const source=root.querySelector('[data-source]');let d=datasets.rtmw,frames=d.frames,end=frames.at(-1).t;slider.max=end;source.onchange=()=>{d=datasets[source.value];frames=d.frames;end=frames.at(-1).t;slider.max=end;t=Math.min(t,end);setPlay(false);draw();save();};
let t=0,playing=false,yaw=3.381592653589793,pitch=.15,distance=3.35,last=0,drag=null;
const add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,s)=>a.map(x=>x*s),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],lerp=(a,b,u)=>a.map((x,i)=>x+(b[i]-x)*u);
function qm(a,b){return [a[0]*b[0]-dot(a.slice(1),b.slice(1)),...add(add(mul(b.slice(1),a[0]),mul(a.slice(1),b[0])),cross(a.slice(1),b.slice(1)))];}
function qr(q,v){const u=q.slice(1);return add(v,mul(add(mul(cross(u,v),q[0]),cross(u,cross(u,v))),2));}
function slerp(a,b,u){let z=dot(a,b);if(z<0){b=mul(b,-1);z=-z;}let q;if(z>.9995)q=lerp(a,b,u);else{const theta=Math.acos(Math.min(1,z));q=add(mul(a,Math.sin((1-u)*theta)/Math.sin(theta)),mul(b,Math.sin(u*theta)/Math.sin(theta)));}return mul(q,1/Math.hypot(...q));}
function pose(){let lo=0,hi=frames.length-1;while(lo+1<hi){const m=(lo+hi)>>1;if(frames[m].t<=t)lo=m;else hi=m;}const a=frames[lo],b=frames[hi],u=Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t))),pos=[],rot=[];
d.model.forEach((body,i)=>{const q=slerp(a.rot.slice(i*4,i*4+4),b.rot.slice(i*4,i*4+4),u);if(body.parent<0){pos[i]=lerp(a.root,b.root,u);rot[i]=q;}else{pos[i]=add(pos[body.parent],qr(rot[body.parent],body.p));rot[i]=qm(rot[body.parent],q);}});
return {inferred:(u<.5?a:b).inferred||[],points:d.nodeBodies.map(i=>pos[i]),raw:a.raw.map((p,i)=>p&&b.raw[i]?lerp(p,b.raw[i],u):null)};}
function color(token){const probe=document.createElement('span');probe.style.color=`var(${token})`;root.append(probe);const c=getComputedStyle(probe).color;probe.remove();return c;}
let palette;function colors(){palette={upper:color('--viz-series-1'),lower:color('--viz-series-2'),raw:color('--muted-foreground'),grid:color('--border')};}colors();
function draw(){const w=cv.clientWidth,h=cv.clientHeight,ratio=window.devicePixelRatio||1;if(cv.width!==Math.round(w*ratio)||cv.height!==Math.round(h*ratio)){cv.width=Math.round(w*ratio);cv.height=Math.round(h*ratio);}ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
const focus=[0,0,.87],dir=[Math.sin(yaw)*Math.cos(pitch),Math.cos(yaw)*Math.cos(pitch),Math.sin(pitch)],right=[Math.cos(yaw),-Math.sin(yaw),0],up=[-Math.sin(yaw)*Math.sin(pitch),-Math.cos(yaw)*Math.sin(pitch),Math.cos(pitch)],f=Math.min(h*1.15,w*1.1);
const project=p=>{const v=sub(p,focus),z=distance-dot(v,dir);return [w/2+dot(v,right)*f/z,h/2-dot(v,up)*f/z,z];};
function line(a,b,c,width,dash=false){const x=project(a),y=project(b);if(x[2]<.1||y[2]<.1)return;ctx.beginPath();ctx.moveTo(x[0],x[1]);ctx.lineTo(y[0],y[1]);ctx.strokeStyle=c;ctx.lineWidth=width;ctx.lineCap='round';ctx.setLineDash(dash?[4,5]:[]);ctx.stroke();ctx.setLineDash([]);}
for(let i=-3;i<=3;i++){line([i*.5,-1.5,0],[i*.5,1.5,0],palette.grid,1);line([-1.5,i*.5,0],[1.5,i*.5,0],palette.grid,1);}
const p=pose();const lowest=Math.min(p.points[7][2],p.points[8][2]);root.querySelector('[data-support]').textContent=lowest>.18?`Опора не подтверждена · нижняя щиколотка ${Math.round(lowest*100)} см над полом`:'';if(raw.checked){d.links.forEach(([a,b])=>{if(p.raw[a]&&p.raw[b])line(p.raw[a],p.raw[b],palette.raw,1.5,true);});p.raw.forEach(v=>{if(!v)return;const s=project(v);ctx.strokeStyle=palette.raw;ctx.lineWidth=1.5;ctx.strokeRect(s[0]-3,s[1]-3,6,6);});}
const items=d.links.map(([a,b])=>({z:(project(p.points[a])[2]+project(p.points[b])[2])/2,a,b}));p.points.forEach((v,i)=>items.push({z:project(v)[2],i}));items.sort((a,b)=>b.z-a.z);for(const it of items){if(it.i===undefined){const lower=it.a>=3&&it.a<=8||it.b>=3&&it.b<=8;line(p.points[it.a],p.points[it.b],lower?palette.lower:palette.upper,Math.max(2,f*.014/it.z));}else{const i=it.i,s=project(p.points[i]);ctx.fillStyle=i>=3&&i<=8?palette.lower:palette.upper;ctx.beginPath();ctx.arc(s[0],s[1],Math.max(3,f*(i===2?.065:.023)/s[2]),0,Math.PI*2);if(p.inferred.includes(i)){ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=2;ctx.stroke();}else ctx.fill();}}
root.querySelector('[data-inferred]').textContent=p.inferred.length?`Полые точки: ${p.inferred.length} суставов без надёжного измерения`:'';time.textContent=`${t.toFixed(1)} / ${end.toFixed(1)} с`;slider.value=t;
}
function save(){window.openai?.setWidgetState?.({modelContent:{source:source.value,time_seconds:+t.toFixed(2),raw_overlay:raw.checked},privateContent:{yaw,pitch,distance,speed:speed.value}})?.catch(()=>{});}
function restore(s){if(!s)return;if(['yolo','rtmw'].includes(s.modelContent?.source)){source.value=s.modelContent.source;d=datasets[source.value];frames=d.frames;end=frames.at(-1).t;slider.max=end;}t=Math.max(0,Math.min(end,s.modelContent?.time_seconds||0));raw.checked=!!s.modelContent?.raw_overlay;const p=s.privateContent||{};if(Number.isFinite(p.yaw))yaw=p.yaw;if(Number.isFinite(p.pitch))pitch=p.pitch;if(Number.isFinite(p.distance))distance=p.distance;if(['0.5','1','2'].includes(p.speed))speed.value=p.speed;draw();}
function setPlay(v){playing=v;play.textContent=v?'Пауза':'Играть';status.textContent=v?'Воспроизведение':'Пауза';}
play.onclick=()=>{if(t>=end)t=0;setPlay(!playing);save();};slider.oninput=()=>{t=+slider.value;setPlay(false);draw();};slider.onchange=save;raw.onchange=()=>{draw();save();};speed.onchange=save;
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);};cv.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.009;pitch=Math.max(-.7,Math.min(1.25,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();};cv.onpointerup=()=>{drag=null;save();};cv.onpointercancel=()=>drag=null;cv.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(1.8,Math.min(7,distance*Math.exp(e.deltaY*.001)));draw();save();},{passive:false});
new ResizeObserver(draw).observe(cv);new MutationObserver(()=>{colors();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));restore(window.openai?.widgetState);draw();
function tick(now){if(playing){t=Math.min(end,t+Math.min(.1,(now-last)/1000)*+speed.value);if(t>=end){setPlay(false);save();}draw();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();
</script>
